name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  # Supports the min-publish-age policy in .cargo/config.toml.
  RUSTUP_TOOLCHAIN: nightly-2026-07-12

jobs:
  session:
    name: Session (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            features: bundled,session,preupdate_hook
            native: true
          - os: macos-15
            target: aarch64-apple-darwin
            features: bundled,session,preupdate_hook
            native: true
          - os: macos-15
            target: aarch64-apple-ios
            features: bundled,session,preupdate_hook
            native: false
          - os: macos-15
            target: aarch64-apple-ios-sim
            features: bundled,session,preupdate_hook
            native: false
          - os: ubuntu-24.04
            target: wasm32-unknown-unknown
            features: session
            native: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install dated Rust toolchain from the official distribution
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --target "$TARGET"
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Verify bindgen is absent from the active dependency graph
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
        run: |
          cargo tree --locked --target "$TARGET" --features "$FEATURES" --edges normal,build --prefix none --format '{p} {f}' > dependency-tree.txt
          cat dependency-tree.txt
          if grep -E '(^bindgen |buildtime_bindgen|(^|[, ])bindgen([, ]|$))' dependency-tree.txt; then
            echo 'Unexpected bindgen dependency or feature' >&2
            exit 1
          fi
      - name: Build library and tests
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
        run: cargo test --locked --target "$TARGET" --features "$FEATURES" --lib --no-run
      - name: Run native unit, integration and documentation tests
        if: matrix.native
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
        run: |
          cargo test --locked --target "$TARGET" --features "$FEATURES" --workspace
          cargo test --locked --target "$TARGET" --no-default-features --features bundled,session --lib
      - name: Verify unsupported system SQLite fails with guidance
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          if cargo check --locked --no-default-features --features session > system-build.log 2>&1; then
            echo 'Expected system SQLite without bindgen to be rejected' >&2
            exit 1
          fi
          cat system-build.log
          grep -F 'system SQLite with session/preupdate_hook requires buildtime_bindgen' system-build.log
      - name: Verify the lockfile was not changed
        run: git diff --exit-code -- Cargo.lock

  lint-and-docs:
    name: Clippy and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install dated Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - name: Check supported native APIs
        run: cargo clippy --locked --workspace --all-targets --features bundled,session,preupdate_hook -- -D warnings
      - name: Reject documentation warnings
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --locked --workspace --no-deps --features bundled,session,preupdate_hook
      - name: Verify the lockfile was not changed
        run: git diff --exit-code -- Cargo.lock

  sanitizer:
    name: Session AddressSanitizer (Rust and SQLite C)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install dated Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src --target x86_64-unknown-linux-gnu
      - name: Run session tests with address instrumentation
        env:
          RUSTFLAGS: -Zsanitizer=address -Cdebuginfo=1
          # Panic payloads are deliberately leaked at the FFI boundary; this
          # job checks invalid memory accesses, not leak freedom.
          ASAN_OPTIONS: detect_stack_use_after_return=1:detect_leaks=0
        run: |
          cargo test --locked -Z build-std --target x86_64-unknown-linux-gnu --features bundled,session,preupdate_hook,with-asan --lib session::
      - name: Verify the lockfile was not changed
        run: git diff --exit-code -- Cargo.lock
